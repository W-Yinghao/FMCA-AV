config:
  base:
    invariance_weight: 25.0
    name: vicreg
    projector_dim: 256
    projector_hidden: 512
    variance_weight: 25.0
  data:
    batch_size: 256
    dataset: cifar10
    n_calibration: 2500
    n_val: 2500
    num_workers: 4
    root: /projects/EEG-foundation-model/yinghao/FMCA-AV/cifar10
    view_tree:
      children_per_edge: 4
      edges:
      - color_jitter_hue: true
        color_jitter_probability: 0.8
        color_jitter_strength: 0.5
        flip_probability: 0.5
        kind: crop
        max_scale: 1.0
        min_scale: 0.2
        size: 32
      - grayscale_probability: 0.2
        kind: crop
        max_scale: 1.0
        min_scale: 0.4
        size: 32
      endpoint_descendants: 8
      flip_probability: 0.0
      mode: nested
      root:
        max_scale: 1.0
        min_scale: 0.95
        size: 32
  experiment:
    family: plugin_study
    name: plugin-vicreg-b16
    status: closure plug-in study (prereg draft)
  loss:
    alpha: 0.2
    beta: 16.0
    ema_target_momentum: 0.99
    epsilon: 1.0e-06
    gamma: 1.0
    ridge: 0.001
    whitening_mode: differentiable
  model:
    activation: gelu
    backbone_width: 64
    feature_dim: 128
    head_hidden_dims:
    - 512
    level_stages:
    - 1
    - 2
    - 3
  objective_note: additive variants take their maximizing per-edge sign inside the
    module; alpha/beta here only affect product_endpoint
  optimizer:
    learning_rate: 0.1
    momentum: 0.9
    name: sgd
    scheduler: cosine
    weight_decay: 0.0001
  output_root: /projects/EEG-foundation-model/yinghao/FMCA-AV/experiment_runs
  plugin:
    enabled: true
  probe:
    batch_size: 256
    epochs: 100
    learning_rate: 0.1
    momentum: 0.9
    n_val: 5000
    num_workers: 4
  row_tag: b16
  seed: 2
  trainer:
    accelerator: gpu
    deterministic: true
    devices: 1
    enable_progress_bar: false
    max_epochs: 200
    precision: 32-true
    strategy: auto
  variant: product_endpoint
